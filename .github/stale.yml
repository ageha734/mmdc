daysUntilStale: 60
daysUntilClose: 14

exemptLabels:
  - pinned
  - security
  - bug
  - enhancement
  - help wanted
  - good first issue
  - in-progress
staleLabel: stale

markComment: >
  This issue has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs within
  14 days. Thank you for your contributions!
closeComment: >
  This issue has been automatically closed due to inactivity.
  Please feel free to reopen if you still have this issue.

exemptMilestones: true
exemptProjects: true
exemptIssueLabels:
  - pinned
  - security

exemptPrLabels:
  - pinned
  - security
  - do-not-close

pulls:
  daysUntilStale: 30
  daysUntilClose: 7
  markComment: >
    This pull request has been automatically marked as stale because it has not had
    recent activity. It will be closed if no further activity occurs within
    7 days. Please update or close this PR if it's no longer needed.
