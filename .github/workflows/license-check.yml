name: "License Check"

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - master

jobs:
  license-check:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: |
          echo "## License Check Report" > license-report.md
          echo "" >> license-report.md

          go-licenses report ./... 2>/dev/null | tee licenses.csv || true

          DISALLOWED=""
          if [ -f .github/LICENSE_ALLOWLIST ]; then
            while IFS= read -r license; do
              [[ "$license" =~ ^#.*$ ]] && continue
              [[ -z "$license" ]] && continue
              ALLOWED_LICENSES="$ALLOWED_LICENSES|$license"
            done < .github/LICENSE_ALLOWLIST

            ALLOWED_LICENSES="${ALLOWED_LICENSES#|}"
            DISALLOWED=$(grep -v -E "$ALLOWED_LICENSES" licenses.csv 2>/dev/null || true)
          fi

          if [ -n "$DISALLOWED" ]; then
            echo "### Disallowed Licenses Found" >> license-report.md
            echo '```' >> license-report.md
            echo "$DISALLOWED" >> license-report.md
            echo '```' >> license-report.md
            echo "" >> license-report.md
            echo "Please review these dependencies or update LICENSE_ALLOWLIST." >> license-report.md
          else
            echo "All dependency licenses are allowed." >> license-report.md
          fi

          echo "" >> license-report.md
          echo "### All Licenses" >> license-report.md
          echo '```' >> license-report.md
          cat licenses.csv >> license-report.md || echo "No licenses found" >> license-report.md
          echo '```' >> license-report.md

      - name: Upload license report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: license-report
          path: |
            license-report.md
            licenses.csv
          retention-days: 30

      - name: Post comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: license-check
          path: license-report.md
