name: "QA Check"

on:
  pull_request:
    paths:
      - "test/e2e/**"
      - "test/QA.md"

jobs:
  qa-check:
    name: Check test/QA.md Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run QA check
        run: go run scripts/check-qa-md.go

      - name: Post comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: qa-check
          message: |
            ## QA Check Failed

            The E2E tests and test/QA.md are out of sync.

            Please run `go run scripts/check-qa-md.go` locally to see the differences and update test/QA.md accordingly.

            **How to fix:**
            1. Run `go run scripts/check-qa-md.go` to see missing or extra test cases
            2. Update `test/QA.md` to include any new tests
            3. Remove any tests from `test/QA.md` that no longer exist
