name: "AI: Copilot Code Review"

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-size:
    name: Check PR Size
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      should_review: ${{ steps.size.outputs.should_review }}
      size_label: ${{ steps.size.outputs.size_label }}
      additions: ${{ steps.size.outputs.additions }}
      deletions: ${{ steps.size.outputs.deletions }}
      total: ${{ steps.size.outputs.total }}
    steps:
      - name: Calculate PR size
        id: size
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          TOTAL=$((ADDITIONS + DELETIONS))

          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -le 9 ]; then
            SIZE_LABEL="XS"
          elif [ "$TOTAL" -le 29 ]; then
            SIZE_LABEL="S"
          elif [ "$TOTAL" -le 99 ]; then
            SIZE_LABEL="M"
          elif [ "$TOTAL" -le 499 ]; then
            SIZE_LABEL="L"
          else
            SIZE_LABEL="XL"
          fi
          echo "size_label=$SIZE_LABEL" >> $GITHUB_OUTPUT

          if [ "$TOTAL" -le 99 ]; then
            echo "should_review=true" >> $GITHUB_OUTPUT
            echo "::notice::PR size ($TOTAL lines, $SIZE_LABEL) qualifies for Copilot review"
          else
            echo "should_review=false" >> $GITHUB_OUTPUT
            echo "::notice::PR size ($TOTAL lines, $SIZE_LABEL) exceeds limit for auto-review"
          fi

  copilot-review:
    name: Request Copilot Review
    runs-on: ubuntu-latest
    needs: check-size
    if: needs.check-size.outputs.should_review == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Request Copilot review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Requesting Copilot review for PR #${prNumber}`);

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: ['copilot-pull-request-reviewer[bot]']
              });
              console.log('Successfully requested Copilot review');
            } catch (error) {
              console.log(`Note: Could not request Copilot review: ${error.message}`);
              console.log('Make sure Copilot code review is enabled for this repository.');
            }

      - name: Post review status
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: copilot-review
          message: |
            ## 🤖 Copilot Auto Review

            | Metric | Value |
            |--------|-------|
            | **Size** | ${{ needs.check-size.outputs.size_label }} (${{ needs.check-size.outputs.total }} lines) |
            | **Additions** | +${{ needs.check-size.outputs.additions }} |
            | **Deletions** | -${{ needs.check-size.outputs.deletions }} |
            | **Status** | ✅ Review Requested |

            Copilot code review has been requested for this PR.

            > **How it works:**
            > - Review comments are added inline with permalinks
            > - Issues are automatically resolved when fixed
            > - Re-runs on each push to the PR

  skip-review:
    name: Skip Review
    runs-on: ubuntu-latest
    needs: check-size
    if: needs.check-size.outputs.should_review == 'false'
    steps:
      - name: Post skip notice
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: copilot-review
          message: |
            ## 🤖 Copilot Auto Review - Skipped

            | Metric | Value |
            |--------|-------|
            | **Size** | ${{ needs.check-size.outputs.size_label }} (${{ needs.check-size.outputs.total }} lines) |
            | **Additions** | +${{ needs.check-size.outputs.additions }} |
            | **Deletions** | -${{ needs.check-size.outputs.deletions }} |
            | **Status** | ⏭️ Skipped (size > M) |

            This PR exceeds the size limit for automatic Copilot review.

            **Options:**
            - Request manual Copilot review via GitHub UI
            - Split into smaller PRs for auto-review
            - Maximum auto-review size: 99 lines (M)
