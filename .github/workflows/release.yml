name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run tests
        run: task test

      - name: Install git-chglog
        run: go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest

      - name: Generate release notes
        id: release_notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          git-chglog --config .chglog/config.yml --output RELEASE_NOTES.md $TAG

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Run GoReleaser
        run: goreleaser release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@deef08a0db64bfad603422135db61477b16cef56 # v0.22.1
        with:
          artifact-name: sbom.spdx.json

  homebrew:
    name: Update Homebrew
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'beta') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc') }}
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ageha734/homebrew-mmdc
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
        continue-on-error: true

      - name: Update formula
        if: success()
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          SHA256=$(curl -sL "https://github.com/ageha734/mmdc/archive/refs/tags/v${VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)

          cat > homebrew-tap/Formula/mmdc.rb << EOF
          class Mmdc < Formula
            desc "Go-based CLI for rendering Mermaid diagrams"
            homepage "https://github.com/ageha734/mmdc"
            url "https://github.com/ageha734/mmdc/archive/refs/tags/v${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "go" => :build
            depends_on "chromium" => :optional

            def install
              system "go", "build", *std_go_args(ldflags: "-s -w -X main.version=#{version}"), "./cmd"
            end

            test do
              system "#{bin}/mmdc", "--version"
            end
          end
          EOF

      - name: Commit and push
        if: success()
        working-directory: homebrew-tap
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/mmdc.rb
          git commit -m "Update mmdc to ${GITHUB_REF#refs/tags/}" || exit 0
          git push
