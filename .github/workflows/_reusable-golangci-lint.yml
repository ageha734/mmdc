name: "Reusable: GolangCI Lint"

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run golangci-lint
        run: task lint

      - name: Setup reviewdog
        if: always()
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: latest

      - name: Run golangci-lint for reviewdog
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run \
            --out-format=checkstyle --config=.golangci.yml 2>/dev/null | \
            reviewdog -f=checkstyle -name="golangci-lint" \
              -reporter=github-pr-review -filter-mode=diff_context -level=warning \
              -fail-level=error
