name: "Reusable: Go Arch Lint"

on:
  workflow_call:

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run go-arch-lint
        run: task arch
