name: "Reusable: Go Arch Lint"

on:
  workflow_call:

jobs:
  arch-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run go-arch-lint
        run: task arch
