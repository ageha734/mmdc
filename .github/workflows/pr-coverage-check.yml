name: PR Coverage Check

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Run tests with coverage
        run: task test

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out > coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html

          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

          echo "## Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "**Total Coverage: ${COVERAGE}%**" >> coverage-report.md
          echo "" >> coverage-report.md
          echo "<details>" >> coverage-report.md
          echo "<summary>Coverage by package</summary>" >> coverage-report.md
          echo "" >> coverage-report.md
          echo '```' >> coverage-report.md
          cat coverage-summary.txt >> coverage-report.md
          echo '```' >> coverage-report.md
          echo "</details>" >> coverage-report.md

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage-summary.txt
          retention-days: 7

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: coverage
          path: coverage-report.md

      - name: Check coverage threshold
        if: github.event.pull_request.draft == false
        run: |
          THRESHOLD=80
          COVERAGE_INT=$(echo $COVERAGE | cut -d. -f1)

          echo "Coverage: $COVERAGE% (Threshold: ${THRESHOLD}%)"

          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "::warning::Coverage ($COVERAGE%) is below threshold (${THRESHOLD}%)"
          else
            echo "Coverage meets the threshold"
          fi

      - name: Generate coverage treemap
        run: |
          go install github.com/nikolaydubina/go-cover-treemap@latest
          go-cover-treemap -coverprofile coverage.out > coverage-treemap.svg || true

      - name: Upload coverage treemap
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-treemap
          path: coverage-treemap.svg
          retention-days: 7
          if-no-files-found: ignore
