name: "Post Release"

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Go and Task
        uses: ./.github/actions/setup-go

      - name: Install git-chglog
        run: go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest

      - name: Generate CHANGELOG
        run: git-chglog --config .chglog/config.yml --output CHANGELOG.md

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update CHANGELOG.md for ${{ github.event.release.tag_name }}"
          title: "docs: Update CHANGELOG.md for ${{ github.event.release.tag_name }}"
          body: |
            This PR updates the CHANGELOG.md with the release notes for ${{ github.event.release.tag_name }}.

            Auto-generated by post-release workflow.
          branch: changelog/update-${{ github.event.release.tag_name }}
          base: master
          labels: documentation, automated
          delete-branch: true

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: update-changelog
    steps:
      - name: Release notification
        run: |
          echo "Release ${{ github.event.release.tag_name }} has been published!"
          echo "Release URL: ${{ github.event.release.html_url }}"
